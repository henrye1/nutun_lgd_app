[project]
name = "nutun-ac-app"
version = "0.1.0"
description = "Nutun PBD amortised-cost valuation app (port of the July-2026 workbooks)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pyodbc>=5.1",
  "openpyxl>=3.1",
  "lxml>=5.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nutun_engine", "api", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "tieout: compares engine output with the reference workbooks (needs tests/fixtures/private)",
  "db: needs a live connection to the client SQL Server (NUTUN_DB_SERVER set)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
